name: Build and release installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            command: build:win
            ffmpeg: ffmpeg.exe
            ffmpeg_metadata: win32-x64
          - os: macos-latest
            platform: mac
            command: build:mac:arm64
            ffmpeg: ffmpeg-darwin-arm64
            ffmpeg_metadata: darwin-arm64
          - os: macos-latest
            platform: mac-x64
            command: build:mac:x64
            ffmpeg: ffmpeg
            ffmpeg_metadata: darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate app icons
        run: npm run icons:generate

      - name: Download FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p node_modules/ffmpeg-static
          case "${{ matrix.platform }}" in
            win) asset="ffmpeg-win32-x64.gz" ;;
            mac) asset="ffmpeg-darwin-arm64.gz" ;;
            mac-x64) asset="ffmpeg-darwin-x64.gz" ;;
          esac
          url="https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/${asset}"
          curl --fail --location "$url" --output ffmpeg.gz
          gunzip -c ffmpeg.gz > node_modules/ffmpeg-static/${{ matrix.ffmpeg }}
          rm ffmpeg.gz
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            chmod +x node_modules/ffmpeg-static/${{ matrix.ffmpeg }}
          fi
          metadata="${{ matrix.ffmpeg_metadata }}"
          curl --fail --location "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/${metadata}.LICENSE.gz" --output ffmpeg-license.gz
          gunzip -c ffmpeg-license.gz > node_modules/ffmpeg-static/${metadata}.LICENSE
          rm ffmpeg-license.gz

      - name: Build installers
        run: npm run ${{ matrix.command }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: whiteboard-video-studio-${{ matrix.platform }}
          path: release/*

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare Android SDK
        shell: bash
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          chmod +x android/gradlew

      - name: Install dependencies and build APK
        run: npm ci && npm run build:android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: whiteboard-video-studio-android
          path: release/Whiteboard-Video-Studio-Android.apk

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
